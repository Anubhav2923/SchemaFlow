services:
  - type: web
    name: schemaflow
    runtime: node
    plan: free
    buildCommand: npm run build
    # root build = frontend build + backend build + copy frontend/dist -> backend/dist/public
    # backend then serves API + static frontend from the same process (no latency / no CORS)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: schemaflow-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: qwen/qwen3.5-122b-a10b
      # Build-time vars for Vite (frontend/dist). Must be set in Render dashboard.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: /api

databases:
  - name: schemaflow-db
    plan: free
